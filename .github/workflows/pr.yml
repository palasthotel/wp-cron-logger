name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-pr.yml@v1
    with:
      # Plugin Check reports errors on this plugin - see https://github.com/palasthotel/wp-cron-logger/issues/29.
      # Remove this line once they are fixed.
      plugin-check: false
      slug: cron-logger
      dev-plugin-name: Cron Logger - DEV
      # The plugin header declares Requires PHP: 8.1
      php-versions: '["8.1", "8.2", "8.3", "8.4", "8.5"]'
      required-files: |
        vendor/autoload.php
        vendor/composer/autoload_static.php
        uninstall.php
        languages/cron-logger-de_DE.mo
